[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-cdss-mlops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dvc>=3.50",
    "mlflow>=2.12",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "wfdb>=4.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.scripts]
ecg-prepare-data = "ecg_mlops.prepare_data:main"
ecg-train = "ecg_mlops.train:main"
ecg-evaluate = "ecg_mlops.evaluate:main"
ecg-compare-register = "ecg_mlops.compare_and_register:main"
ecg-promote-model = "ecg_mlops.promote_model:main"

[tool.setuptools.packages.find]
where = ["src"]
