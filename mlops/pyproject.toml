[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sepsis-cdss-mlops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dvc>=3.50",
    "mlflow>=2.12",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
sepsis-prepare-data = "sepsis_mlops.prepare_data:main"
sepsis-train = "sepsis_mlops.train:main"
sepsis-evaluate = "sepsis_mlops.evaluate:main"
sepsis-compare-register = "sepsis_mlops.compare_and_register:main"
sepsis-promote-model = "sepsis_mlops.promote_model:main"

[tool.setuptools.packages.find]
where = ["src"]
