services:
  # ── Infrastructure ──
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      # KRaft mode (no Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - ./infra/kafka/create-topics.sh:/scripts/create-topics.sh
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 15s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sepsis_cdss}
      POSTGRES_USER: ${POSTGRES_USER:-sepsis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sepsis_secret_2024}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sepsis_admin} -d ${POSTGRES_DB:-sepsis_cdss}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.12.0
    ports:
      - "15000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts mlflow:5000,localhost:5000,localhost:15000,127.0.0.1:15000
    volumes:
      - mlflow-data:/mlflow

  # ── Backend (FastAPI) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18800:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://sepsis_admin:sepsis_secret_2024@postgres:5432/sepsis_cdss}
      SECRET_KEY: ${SECRET_KEY:-change-me-super-secret-key-at-least-32-chars}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      AIRFLOW_API_URL: ${AIRFLOW_API_URL:-http://airflow-webserver:8080/api/v1}
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-admin123}
    volumes:
      - ./data/processed:/app/data/processed:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure

  # ── Frontend (React) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "13000:3000"
    depends_on:
      - backend

  # ── Replay Producer ──
  replay-producer:
    build:
      context: ./services
      dockerfile: replay-producer/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://sepsis_admin:sepsis_secret_2024@postgres:5432/sepsis_cdss}
      SEPSIS_RECORD: ${SEPSIS_RECORD:-}
      HOUR_INTERVAL_SEC: ${HOUR_INTERVAL_SEC:-1.0}
      N_PATIENTS: ${N_PATIENTS:-3}
    volumes:
      - ./Data/sepsis-2019:/app/data
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure

  # ── Preprocess Buffer ──
  preprocess-buffer:
    build:
      context: ./services
      dockerfile: preprocess-buffer-service/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

  # ── Inference Service ──
  inference-service:
    build:
      context: ./services
      dockerfile: inference-service/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      MODEL_CHECKPOINT: ${MODEL_CHECKPOINT:-artifacts/sepsis_model.json}
      MODEL_URI: ${MODEL_URI:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    volumes:
      - ./services/inference-service/artifacts:/app/artifacts
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

  # ── Alert Engine ──
  alert-engine:
    build:
      context: ./services
      dockerfile: alert-engine-service/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://sepsis_admin:sepsis_secret_2024@postgres:5432/sepsis_cdss}
      ALERT_RISK_THRESHOLD: ${ALERT_RISK_THRESHOLD:-0.6}
      SUSTAINED_HOURS: ${SUSTAINED_HOURS:-3}
      COOLDOWN_HOURS: ${COOLDOWN_HOURS:-12}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure

  # ── Airflow ──
  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /app/data/processed /app/artifacts /app/services/inference-service/artifacts &&
        chmod -R 777 /app/data/processed /app/artifacts /app/services/inference-service/artifacts &&
        airflow db migrate &&
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@sepsis-cdss.local \
          --password admin123 || true
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://sepsis_admin:sepsis_secret_2024@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nIe3aI="
      AIRFLOW__WEBSERVER__SECRET_KEY: "sepsis-cdss-airflow-shared-secret-key-2026"
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./mlops:/app/mlops
      - ./services:/app/services
      - ./Data:/app/Data
      - ./params.yaml:/app/params.yaml
      - airflow-processed:/app/data/processed
      - airflow-artifacts:/app/artifacts
      - ./services/inference-service/artifacts:/app/services/inference-service/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    command: airflow webserver
    ports:
      - "18080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://sepsis_admin:sepsis_secret_2024@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nIe3aI="
      AIRFLOW__WEBSERVER__SECRET_KEY: "sepsis-cdss-airflow-shared-secret-key-2026"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./mlops:/app/mlops
      - ./services:/app/services
      - ./Data:/app/Data
      - ./params.yaml:/app/params.yaml
      - airflow-processed:/app/data/processed
      - airflow-artifacts:/app/artifacts
      - ./services/inference-service/artifacts:/app/services/inference-service/artifacts
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    command: airflow scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://sepsis_admin:sepsis_secret_2024@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nIe3aI="
      AIRFLOW__WEBSERVER__SECRET_KEY: "sepsis-cdss-airflow-shared-secret-key-2026"
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./mlops:/app/mlops
      - ./services:/app/services
      - ./Data:/app/Data
      - ./params.yaml:/app/params.yaml
      - airflow-processed:/app/data/processed
      - airflow-artifacts:/app/artifacts
      - ./services/inference-service/artifacts:/app/services/inference-service/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  mlflow-data:
  airflow-processed:
  airflow-artifacts:
