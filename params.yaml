data:
  raw_dir: Data/sepsis-2019
  processed_dir: data/processed
  split:
    train_frac: 0.70
    val_frac: 0.15
    test_frac: 0.15
    random_seed: 42

features:
  rolling_window: 6

xgboost:
  num_boost_round: 600
  early_stopping_rounds: 50
  max_depth: 6
  eta: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5
  gamma: 1.0

evaluate:
  decision_threshold: 0.5
  min_auroc: 0.75

tracking:
  experiment_name: sepsis-cdss
  registered_model_name: sepsis-xgb-earlywarning

artifacts:
  dir: artifacts
