stages:
  prepare_data:
    cmd: python -m sepsis_mlops.prepare_data --params params.yaml
    deps:
      - mlops/src/sepsis_mlops
      - Data/sepsis-2019
      - params.yaml
    outs:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
      - data/processed/dataset_stats.json

  train:
    cmd: python -m sepsis_mlops.train --params params.yaml --output artifacts/model/challenger.json
    deps:
      - mlops/src/sepsis_mlops
      - data/processed/train.parquet
      - data/processed/val.parquet
      - params.yaml
    outs:
      - artifacts/model/challenger.json

  evaluate:
    cmd: python -m sepsis_mlops.evaluate --params params.yaml --checkpoint artifacts/model/challenger.json --output artifacts/evaluation/metrics.json
    deps:
      - mlops/src/sepsis_mlops
      - data/processed/test.parquet
      - artifacts/model/challenger.json
      - params.yaml
    metrics:
      - artifacts/evaluation/metrics.json:
          cache: false

  compare_and_register:
    cmd: python -m sepsis_mlops.compare_and_register --params params.yaml --checkpoint artifacts/model/challenger.json --metrics artifacts/evaluation/metrics.json
    deps:
      - mlops/src/sepsis_mlops
      - artifacts/model/challenger.json
      - artifacts/evaluation/metrics.json
      - params.yaml
