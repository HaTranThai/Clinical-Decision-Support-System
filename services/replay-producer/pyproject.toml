[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "replay-producer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "confluent-kafka>=2.3.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
]
